spring:
  config:
    activate:
      on-profile: "test"

  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL;NON_KEYWORDS=YEAR,ORDER;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH

discord:
  enabled: false

# 테스트 컨텍스트의 S3Presigner 생성에 사용하는 더미 값
storage:
  r2:
    endpoint: https://r2.test.invalid
    bucket: test-bucket
    access-key-id: test-access-key
    secret-access-key: test-secret-key
    upload-url-ttl: 15m
    download-url-ttl: 15m
